{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 600px;">
    <h2>Settings</h2>

    <form method="POST" class="mb-4">
        {% csrf_token %}

        <label class="mt-3">Low Stock Threshold</label>
        <input type="number" name="threshold" class="form-control mb-3"
               value="{{ settings.low_stock_threshold }}">

        <label>Theme</label>
        <select name="theme" class="form-control mb-3">
            <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
            <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
        </select>

        <button class="btn btn-primary w-100 mb-3">Save Settings</button>
    </form>


    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <strong>Data Backup</strong>
        </div>
        <div class="card-body">
            <p>Download a full backup of all inventory data.</p>
            <a href="{% url 'backup_data' %}" class="btn btn-success w-100">
                ⬇ Download Backup (JSON)
            </a>
        </div>
    </div>


    <div class="card shadow-sm mt-4">
        <div class="card-header bg-danger text-white">
            <strong>Restore Data</strong>
        </div>
        <div class="card-body">
            <p class="text-danger"><strong>Warning:</strong> Restoring will overwrite existing items, sales history, and restock logs.</p>

            <form method="POST" enctype="multipart/form-data" action="{% url 'restore_data' %}">
                {% csrf_token %}
                <input type="file" name="backup_file" class="form-control mb-3" required>
                <button class="btn btn-danger w-100">⟲ Restore From Backup</button>
            </form>
        </div>
    </div>

</div>

{% endblock %}
