{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 500px;">
    <h2>Settings</h2>

    <form method="POST">
        {% csrf_token %}

        <label class="mt-3">Low Stock Threshold</label>
        <input type="number" name="threshold" class="form-control mb-3" value="{{ settings.low_stock_threshold }}">

        <label>Theme</label>
        <select name="theme" class="form-control mb-3">
            <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
            <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
        </select>

        <button class="btn btn-primary w-100">Save Settings</button>
    </form>
</div>

{% endblock %}
