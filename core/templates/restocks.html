{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <h2>Recent Restocks</h2>

    <ul class="list-group mt-3">
        {% for r in restocks %}
        <li class="list-group-item">
            {{ r.item.name }} — {{ r.quantity_added }} pcs — {{ r.date }}
        </li>
        {% empty %}
        <p class="text-muted">No restocks</p>
        {% endfor %}
    </ul>
</div>

{% endblock %}
