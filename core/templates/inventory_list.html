{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <h2>Inventory</h2>

    <form class="d-flex my-3">
        <input name="search" class="form-control" placeholder="Search...">
        <button class="btn btn-primary ms-2">Search</button>
    </form>

    <table class="table table-bordered table-striped mt-3">
        <thead>
            <tr>
                <th>Name</th>
                <th>SKU</th>
                <th>Qty</th>
                <th>Last Restock</th>
                <th>Price</th>
                <th></th>
            </tr>
        </thead>

        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.sku }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.last_restock_date }}</td>
                <td>${{ item.price }}</td>
                <td>
                    <a href="/inventory/{{ item.id }}/" class="btn btn-sm btn-info">View</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="text-center">No items found.</td></tr>
            {% endfor %}
        </tbody>

    </table>
</div>

{% endblock %}
