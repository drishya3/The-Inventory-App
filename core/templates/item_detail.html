{% extends 'base.html' %}
{% block content %}

<div class="container mt-5" style="max-width: 600px;">

    <h2>Item Detail: {{ item.name }}</h2>

    <form method="POST" class="mt-3">
        {% csrf_token %}

        <label>Name</label>
        <input class="form-control mb-3" name="name" value="{{ item.name }}">

        <label>Price</label>
        <input class="form-control mb-3" name="price" value="{{ item.price }}">

        <label>Quantity</label>
        <input class="form-control mb-3" name="quantity" value="{{ item.quantity }}">

        <button class="btn btn-primary">Update</button>
    </form>

</div>
    <a href="/inventory/{{ item.id }}/sell/" class="btn btn-danger mt-3">Sell Stock</a>
    <a href="/inventory/{{ item.id }}/restock/" class="btn btn-success mt-3">Restock Item</a>


{% endblock %}
