{% extends 'base.html' %}
{% block content %}

<div class="container mt-5" style="max-width: 700px;">

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Item – {{ item.name }}</h4>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input class="form-control" name="name" value="{{ item.name }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input class="form-control" name="price" value="{{ item.price }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input class="form-control" name="quantity" value="{{ item.quantity }}">
                </div>

                <button class="btn btn-primary w-100 mt-3">Update Item</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Stock Actions</h5>
        </div>
        <div class="card-body text-center">

            <a href="/inventory/{{ item.id }}/sell/" class="btn btn-danger w-100 mb-2">
                Sell Stock
            </a>

            <a href="/inventory/{{ item.id }}/restock/" class="btn btn-success w-100">
                Restock Item
            </a>

        </div>
    </div>

</div>

{% endblock %}
