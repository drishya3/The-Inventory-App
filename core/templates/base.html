<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body.dark-mode {
            background-color: #121212 !important;
            color: white !important;
        }
        body.light-mode {
            background-color: #f5f5f5 !important;
            color: black !important;
        }
    </style>
</head>

<body class="{% if settings.theme == 'dark' %}dark-mode{% else %}light-mode{% endif %}">

{% if request.user.is_authenticated %}
<nav class="navbar navbar-expand-lg
    {% if settings.theme == 'dark' %}navbar-dark bg-dark{% else %}navbar-light bg-light{% endif %}">
    <div class="container-fluid">

        <a class="navbar-brand" href="/home/">Inventory App</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link {% if request.path == '/home/' %}active{% endif %}" href="/home/">Home</a></li>
                <li class="nav-item"><a class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}" href="/dashboard/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link {% if '/inventory/' in request.path and 'add' not in request.path %}active{% endif %}" href="/inventory/">Inventory</a></li>
                <li class="nav-item"><a class="nav-link {% if '/inventory/add/' in request.path %}active{% endif %}" href="/inventory/add/">Add Item</a></li>
                <li class="nav-item"><a class="nav-link {% if request.path == '/reports/' %}active{% endif %}" href="/reports/">Reports</a></li>
                <li class="nav-item"><a class="nav-link {% if request.path == '/settings/' %}active{% endif %}" href="/settings/">Settings</a></li>
            </ul>

            <span class="navbar-text me-3">
                Hello, {{ request.user.username }}!
            </span>

            <a href="/logout/" class="btn btn-outline-info btn-sm">Logout</a>
        </div>

    </div>
</nav>
{% endif %}

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
