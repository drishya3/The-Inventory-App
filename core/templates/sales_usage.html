{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <h2>Sales / Usage</h2>

    <ul class="list-group mt-3">
        {% for s in sales %}
        <li class="list-group-item">
            {{ s.item__name }} — {{ s.total }} sold
        </li>
        {% empty %}
        <p class="text-muted">No sales data</p>
        {% endfor %}
    </ul>
</div>

{% endblock %}
